<div class="new-songs-modal">
  <h2 mat-dialog-title class="new-songs-modal_title">Add New Song</h2>

  <mat-dialog-content class="new-songs-modal_content">
    <form class="new-songs-modal_form" >
      <mat-form-field class="new-songs-modal_form-field">
        <mat-label>Artist</mat-label>
        <input matInput placeholder="Ex: Chase Atlantic" />
      </mat-form-field>

      <mat-form-field class="new-songs-modal_form-field">
        <mat-label>Song</mat-label>
        <input matInput placeholder="Ex: Favela" />
      </mat-form-field>

      <mat-form-field class="new-songs-modal_form-field">
        <mat-label>Album</mat-label>
        <input matInput placeholder="Ex: Lost in Heaven" />
      </mat-form-field>

      <mat-form-field class="new-songs-modal_form-field">
        <mat-label>Year</mat-label>
        <input matInput placeholder="Ex: 2024" />
      </mat-form-field>

      <mat-form-field class="new-songs-modal_form-field">
        <mat-label>Genre</mat-label>
        <input matInput placeholder="Ex: Pop" />
      </mat-form-field>

      <mat-form-field class="new-songs-modal_form-field">
        <mat-label>Duration</mat-label>
        <input matInput placeholder="Ex: 3:44" />
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton (click)="close()">Close</button>
    <button matButton cdkFocusInitial (click)="save()">Save</button>
  </mat-dialog-actions>
</div>
